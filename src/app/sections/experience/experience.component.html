<section class="experience">
  <div class="container">
    <app-section-heading
      index="02"
      eyebrow="Experience"
      title="What I've"
      accent="shipped"
      lead="Production work across telehealth, analytics, AI governance and subscription platforms."
    />

    <ol class="timeline">
      @for (role of roles; track role.company) {
        <li class="role">
          <!-- Sticky metadata rail -->
          <div class="role__aside">
            <p class="role__period">
              <span class="role__dot" aria-hidden="true"></span>
              {{ role.period }}
            </p>
            <h3 class="role__title">{{ role.title }}</h3>
            <p class="role__company">{{ role.company }}</p>
            @if (role.current) {
              <p class="role__badge">Current</p>
            }
          </div>

          <ul class="bullets">
            @for (h of role.highlights; track h.text; let i = $index) {
              <li class="bullet" appReveal [revealDelay]="i * 60">
                <span class="bullet__n" aria-hidden="true">{{ i + 1 < 10 ? '0' : '' }}{{ i + 1 }}</span>
                <span [innerHTML]="h.text | emphasize: h.emphasis"></span>
              </li>
            }
          </ul>
        </li>
      }
    </ol>
  </div>
</section>
