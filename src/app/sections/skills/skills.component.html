<section class="skills">
  <div class="container">
    <app-section-heading
      index="03"
      eyebrow="Skills"
      title="The toolkit behind"
      accent="the work"
      lead="What I reach for day to day — grouped the way I actually use it."
    />

    <!-- Numbered rows, not floating cards -->
    <div class="rows">
      @for (group of groups; track group.title; let g = $index) {
        <article class="row" appReveal [revealDelay]="g * 70">
          <div class="row__head">
            <span class="row__icon"><app-icon [name]="group.icon" [size]="18" /></span>
            <h3 class="row__title">{{ group.title }}</h3>
            <span class="row__count">{{ group.skills.length }}</span>
          </div>

          <ul class="chips">
            @for (skill of group.skills; track skill) {
              <li class="chip">{{ skill }}</li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>
