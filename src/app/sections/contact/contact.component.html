<section class="contact">
  <div class="container">
    <div class="panel" appReveal="scale">
      <div class="panel__glow" aria-hidden="true"></div>

      <app-section-heading
        eyebrow="Contact"
        title="Let's build something"
        accent="fast and accessible"
        lead="Open to Frontend and Angular roles. The quickest way to reach me is email — I reply to everything."
        [center]="true"
      />

      <!-- Primary actions -->
      <div class="panel__actions" appReveal [revealDelay]="120">
        <a class="btn" [href]="'mailto:' + profile.email">
          <app-icon name="mail" [size]="17" />
          Email me
        </a>
        <a class="btn btn--ghost" [href]="profile.linkedin" target="_blank" rel="noopener noreferrer">
          <app-icon name="linkedin" [size]="17" />
          Connect on LinkedIn
          <app-icon name="external" [size]="13" />
        </a>
      </div>

      <!-- Copyable details -->
      <ul class="details">
        <li class="detail" appReveal [revealDelay]="180">
          <span class="detail__icon"><app-icon name="mail" [size]="17" /></span>
          <div class="detail__body">
            <span class="detail__label">Email</span>
            <a class="detail__value" [href]="'mailto:' + profile.email">{{ profile.email }}</a>
          </div>
          <button
            type="button"
            class="detail__copy"
            (click)="copy(profile.email, 'email')"
            [attr.aria-label]="'Copy email address'"
          >
            @if (copied() === 'email') {
              <app-icon name="check" [size]="15" />
            } @else {
              <app-icon name="copy" [size]="15" />
            }
          </button>
        </li>

        <li class="detail" appReveal [revealDelay]="240">
          <span class="detail__icon"><app-icon name="phone" [size]="17" /></span>
          <div class="detail__body">
            <span class="detail__label">Phone</span>
            <a class="detail__value" [href]="telHref">{{ profile.phone }}</a>
          </div>
          <button
            type="button"
            class="detail__copy"
            (click)="copy(profile.phone, 'phone')"
            [attr.aria-label]="'Copy phone number'"
          >
            @if (copied() === 'phone') {
              <app-icon name="check" [size]="15" />
            } @else {
              <app-icon name="copy" [size]="15" />
            }
          </button>
        </li>

        <li class="detail" appReveal [revealDelay]="300">
          <span class="detail__icon"><app-icon name="pin" [size]="17" /></span>
          <div class="detail__body">
            <span class="detail__label">Location</span>
            <span class="detail__value">{{ profile.location }}</span>
          </div>
        </li>
      </ul>

      <!-- Live region announcing the copy result -->
      <p class="sr-only" role="status" aria-live="polite">
        @if (copied()) {
          {{ copied() }} copied to clipboard
        }
      </p>
    </div>
  </div>
</section>
