<div class="progress" aria-hidden="true">
  <div class="progress__bar" [style.transform]="'scaleX(' + progress() + ')'"></div>
</div>

<header class="nav" [class.nav--solid]="scrolled()">
  <nav class="nav__inner container" aria-label="Primary">
    <a class="brand" href="#home" (click)="$event.preventDefault(); go('home')" aria-label="Arslan Awan — back to top">
      <span class="brand__mark" aria-hidden="true">AA</span>
      <span class="brand__txt">
        <b>Arslan Awan</b>
        <i>Frontend Engineer</i>
      </span>
    </a>

    <ul class="links">
      @for (item of navItems; track item.id; let i = $index) {
        <li>
          <a
            class="link"
            [class.is-active]="active() === item.id"
            [attr.aria-current]="active() === item.id ? 'true' : null"
            [href]="'#' + item.id"
            (click)="$event.preventDefault(); go(item.id)"
          >
            <span class="link__n">0{{ i + 1 }}</span>
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <div class="actions">
      <button
        type="button"
        class="tog"
        (click)="theme.toggle()"
        [attr.aria-label]="'Switch to ' + (theme.isDark() ? 'light' : 'dark') + ' mode'"
        [attr.aria-pressed]="theme.isDark()"
      >
        <span class="tog__track">
          <span class="tog__thumb" [class.is-dark]="theme.isDark()">
            <app-icon [name]="theme.isDark() ? 'moon' : 'sun'" [size]="12" />
          </span>
        </span>
      </button>

      <button type="button" class="cta" (click)="openHire()">
        <span>Hire me</span>
        <app-icon name="arrow-up-right" [size]="14" />
      </button>

      <button
        type="button"
        class="burger"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle menu"
        aria-controls="m-menu"
      >
        <span [class.is-open]="menuOpen()"></span>
        <span [class.is-open]="menuOpen()"></span>
      </button>
    </div>
  </nav>

  <div class="sheet" id="m-menu" [class.is-open]="menuOpen()" [attr.inert]="menuOpen() ? null : ''">
    <ul class="sheet__list">
      @for (item of navItems; track item.id; let i = $index) {
        <li [style.--i]="i">
          <a
            [class.is-active]="active() === item.id"
            [href]="'#' + item.id"
            (click)="$event.preventDefault(); go(item.id)"
          >
            <span class="sheet__n">0{{ i + 1 }}</span>
            {{ item.label }}
            <app-icon name="arrow-up-right" [size]="15" />
          </a>
        </li>
      }
    </ul>
    <button type="button" class="btn sheet__cta" (click)="openHire()">
      <app-icon name="mail" [size]="16" />
      Hire me
    </button>
  </div>
</header>
