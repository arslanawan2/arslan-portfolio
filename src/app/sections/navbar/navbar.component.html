<!-- Reading progress -->
<div class="progress" aria-hidden="true">
  <div class="progress__bar" [style.transform]="'scaleX(' + progress() + ')'"></div>
</div>

<header class="nav" [class.nav--solid]="scrolled()">
  <nav class="nav__inner container" aria-label="Primary">
    <!-- Wordmark -->
    <a
      class="brand"
      href="#home"
      (click)="$event.preventDefault(); go('home')"
      [attr.aria-label]="profile.name + ' — back to top'"
    >
      <span class="brand__mark" aria-hidden="true">
        <span class="brand__initials">AA</span>
      </span>
      <span class="brand__text">
        <span class="brand__name">{{ profile.name }}</span>
        <span class="brand__role">Frontend Engineer</span>
      </span>
    </a>

    <!-- Desktop links -->
    <ul class="nav__links" [class.is-open]="menuOpen()">
      @for (item of navItems; track item.id) {
        <li>
          <a
            class="nav__link"
            [class.is-active]="active() === item.id"
            [attr.aria-current]="active() === item.id ? 'page' : null"
            [href]="'#' + item.id"
            (click)="$event.preventDefault(); go(item.id)"
          >
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <div class="nav__actions">
      <!-- Theme toggle -->
      <button
        type="button"
        class="theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-label]="'Switch to ' + (theme.isDark() ? 'light' : 'dark') + ' mode'"
        [attr.aria-pressed]="theme.isDark()"
        title="Toggle theme"
      >
        <span class="theme-toggle__track">
          <span class="theme-toggle__thumb" [class.is-dark]="theme.isDark()">
            @if (theme.isDark()) {
              <app-icon name="moon" [size]="13" />
            } @else {
              <app-icon name="sun" [size]="13" />
            }
          </span>
        </span>
      </button>

      <button type="button" class="btn btn--sm nav__cta" (click)="openHire()">
        <app-icon name="mail" [size]="15" />
        <span>Hire me</span>
      </button>

      <!-- Mobile menu trigger -->
      <button
        type="button"
        class="burger"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle navigation menu"
        aria-controls="mobile-menu"
      >
        <span class="burger__bar" [class.is-open]="menuOpen()"></span>
        <span class="burger__bar" [class.is-open]="menuOpen()"></span>
      </button>
    </div>
  </nav>

  <!-- Mobile sheet -->
  <div class="mobile" id="mobile-menu" [class.is-open]="menuOpen()" [attr.inert]="menuOpen() ? null : ''">
    <ul class="mobile__list">
      @for (item of navItems; track item.id; let i = $index) {
        <li class="mobile__item" [style.--i]="i">
          <a
            class="mobile__link"
            [class.is-active]="active() === item.id"
            [href]="'#' + item.id"
            (click)="$event.preventDefault(); go(item.id)"
          >
            <span class="mobile__index">0{{ i + 1 }}</span>
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </div>
</header>
