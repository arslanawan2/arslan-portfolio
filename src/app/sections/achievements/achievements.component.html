<section class="achievements">
  <div class="container">
    <app-section-heading
      eyebrow="Achievements"
      title="Impact worth"
      accent="calling out"
      lead="Two pieces of work that changed how the products — and the teams — operate."
    />

    <div class="ach__grid">
      @for (item of achievements; track item.title; let i = $index) {
        <article class="ach" appTilt appReveal="scale" [revealDelay]="i * 120">
          <span class="ach__num" aria-hidden="true">0{{ i + 1 }}</span>
          <span class="ach__icon"><app-icon [name]="item.icon" [size]="22" /></span>
          <h3 class="ach__title">{{ item.title }}</h3>
          <p class="ach__detail">{{ item.detail }}</p>
        </article>
      }
    </div>

    <!-- Integration strip -->
    <div class="services" appReveal>
      <p class="services__label">Services integrated in production</p>
      <ul class="services__list">
        @for (s of services; track s; let i = $index) {
          <li class="services__item" appReveal="scale" [revealDelay]="i * 60">{{ s }}</li>
        }
      </ul>
    </div>
  </div>
</section>
