    <!--
      Theme is resolved before first paint. Dark is the default:
      only an explicit stored "light" switches the palette, so a
      first-time visitor always lands on the dark treatment.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('aa-theme') === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          /* storage blocked — the dark default in the markup stands */
        }
      })();
    </script>
