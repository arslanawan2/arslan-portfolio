    <!--
      Applies the saved theme before first paint. Without this the
      page would render light for a frame and then snap to dark.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('aa-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* storage blocked — fall back to the CSS media query */
        }
      })();
    </script>
