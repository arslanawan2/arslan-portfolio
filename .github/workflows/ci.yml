name: CI

# Guards the branches that feed main, so a broken commit is caught
# before it can reach a deploy.
on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm exec ng test --watch=false --browsers=ChromeHeadlessCI

      # Mirrors the resolution in deploy.yml so CI builds the same
      # way the deploy will.
      - name: Resolve base href
        id: base
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          if [ "$repo" = "$owner.github.io" ] || [ -f public/CNAME ]; then
            href="/"
          else
            href="/$repo/"
          fi
          echo "href=$href" >> "$GITHUB_OUTPUT"

      - name: Production build
        run: pnpm exec ng build --configuration production --base-href "${{ steps.base.outputs.href }}"
